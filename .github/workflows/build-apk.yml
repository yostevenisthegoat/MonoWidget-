name: Build and Release Open-Source APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          java -version
          JAVA_VER_RAW="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$JAVA_VER_RAW" ]; then
            echo "::error::Unable to detect Java version."
            exit 1
          fi
          if [[ "$JAVA_VER_RAW" == 1.* ]]; then
            JAVA_MAJOR="$(echo "$JAVA_VER_RAW" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(echo "$JAVA_VER_RAW" | cut -d. -f1)"
          fi
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '$JAVA_VER_RAW'."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [ -z "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in JAVA_HOME or PATH."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Extract App Metadata and Rename APK
        id: metadata
        run: |
          APP_NAME=""
          if [ -f "app/build.gradle.kts" ]; then
            APP_NAME="$(grep -E 'resValue\("string",\s*"app_name"' app/build.gradle.kts | sed -E 's/.*"app_name",[[:space:]]*"([^"]+)".*/\1/' | head -n1 || true)"
          fi
          if [ -z "$APP_NAME" ] && [ -f "app/src/main/res/values/strings.xml" ]; then
            APP_NAME="$(grep -E '<string name="app_name">' app/src/main/res/values/strings.xml | sed -E 's/.*<string name="app_name">([^<]+)<\/string>.*/\1/' | head -n1 || true)"
          fi
          if [ -z "$APP_NAME" ] && [ -f "settings.gradle.kts" ]; then
            APP_NAME="$(grep -E 'rootProject\.name' settings.gradle.kts | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' | head -n1 || true)"
          fi
          APP_NAME="$(echo "${APP_NAME:-App}" | tr -d '[:space:]' | sed -E 's/[^A-Za-z0-9._-]+/-/g')"

          APP_VERSION=""
          if [ -f "app/build.gradle.kts" ]; then
            APP_VERSION="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' | head -n1 || true)"
          fi
          if [ -z "$APP_VERSION" ] && [ -f "gradle/libs.versions.toml" ]; then
            APP_VERSION="$(grep -E '^[[:space:]]*(appVersion|versionName)[[:space:]]*=' gradle/libs.versions.toml | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' | head -n1 || true)"
          fi
          APP_VERSION="$(echo "${APP_VERSION:-1.0}" | sed -E 's/^v//' | tr -d '[:space:]' | sed -E 's/[^A-Za-z0-9._-]+/-/g')"

          APK_FILE_NAME="${APP_NAME}-v${APP_VERSION}.apk"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="app/build/outputs/apk/debug/${APK_FILE_NAME}"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Expected APK not found at $SOURCE_APK"
            exit 1
          fi

          cp -f "$SOURCE_APK" "$TARGET_APK"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=${APK_FILE_NAME}" >> "$GITHUB_ENV"

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_file_name=${APK_FILE_NAME}" >> "$GITHUB_OUTPUT"

          echo "Extracted APP_NAME=${APP_NAME}, APP_VERSION=${APP_VERSION}, APK_FILE_NAME=${APK_FILE_NAME}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILE_NAME }}
          if-no-files-found: error

      - name: Prepare APK release asset and changelog
        id: prepare_release
        run: |
          RELEASE_TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          SOURCE_APK="app/build/outputs/apk/debug/${APK_FILE_NAME}"
          PREPARED_ASSET="${RELEASE_TMP_DIR}/${APK_FILE_NAME}"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Renamed APK not found at $SOURCE_APK"
            exit 1
          fi

          cp -f "$SOURCE_APK" "$PREPARED_ASSET"

          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" | head -n 15 || true)"
          fi
          if [ -z "${CHANGELOG:-}" ]; then
            CHANGELOG="$(git log -n 10 --no-merges --pretty=format:"- %s (%h)" || true)"
          fi
          if [ -z "${CHANGELOG:-}" ]; then
            CHANGELOG="- Automated build from commit ${GITHUB_SHA}"
          fi

          echo "asset_path=${PREPARED_ASSET}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF_CHANGELOG"
            printf '%s\n' "$CHANGELOG"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to Public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.prepare_release.outputs.changelog }}
        run: |
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          {
            echo "## 📢 What's New"
            printf '%s\n' "$CHANGELOG"
            echo ""
            echo "---"
            echo ""
            echo "🌐 **Open Source Build:** Built publicly by GitHub Actions."
            echo ""
            echo "- **App Name:** ${APP_NAME}"
            echo "- **Version:** v${APP_VERSION}"
            echo "- **Build Run:** #${GITHUB_RUN_NUMBER}"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
          } > "$NOTES_FILE"

          gh release create "v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}" \
            "${{ steps.prepare_release.outputs.asset_path }}" \
            --title "${APP_NAME} v${APP_VERSION} (Build #${GITHUB_RUN_NUMBER})" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            --latest
